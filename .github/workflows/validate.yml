name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill packages
        run: python3 scripts/validate_skills.py

      - name: Run behavioral smoke tests
        run: python3 -m unittest discover -s tests -v

  numerical:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install regression dependencies
        run: python -m pip install -r tests/requirements-numerical.txt

      - name: Require a working numerical stack
        run: python -c "import anndata, numpy, scipy, pandas, h5py"

      - name: Run real AnnData synthetic regressions
        run: python -m unittest discover -s tests -p 'test_scrna_analysis_core.py' -v
